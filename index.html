</style></head><body>
<header><div class="head"><div class="brand"><h1>Future Care — مركز قيادة أداء الأطباء</h1><p>تحليل شامل من ملف واحد: الأداء، الخدمات، HARP، الملاحظات والاستثناءات</p></div><div class="actions"><button class="btn ghost" id="theme">🌙</button><button class="btn white" id="newFile">📂 ملف جديد</button><button class="btn green" id="excel" disabled>⬇ Excel كامل</button><button class="btn blue" id="pdf" disabled>📄 PDF</button></div></div></header>
<main><label class="drop" id="drop"><input id="file" type="file" accept=".xls,.xlsx,.xlsm,.html"><div><div class="ico">📊</div><h2>أسقط ملف Future Care الشامل هنا</h2><p>يدعم XLS / XLSX / HTML ويكتشف الأعمدة تلقائيًا<br>يجب أن يحتوي PTID وDoctor Name وDR P وDR D</p></div></label><div class="status" id="status">في انتظار الملف…</div>
<section class="workspace" id="workspace"><div class="toolbar"><div class="filters"><input id="search" placeholder="بحث بالمريض أو الطبيب"><select id="doctor"><option value="">كل الأطباء</option></select><select id="branch"><option value="">كل الفروع</option></select><select id="city"><option value="">كل المدن</option></select><select id="company"><option value="">كل الشركات</option></select><select id="harp"><option value="">كل HARP</option><option>High</option><option>Moderate</option><option>Low</option><option>Unknown</option></select><select id="service"><option value="">كل الخدمات</option></select><input id="reportDate" type="date" title="تاريخ التقرير"></div><div class="tabs" id="tabs"><button class="tab active" data-p="overview">الملخص</button><button class="tab" data-p="doctors">الأطباء</button><button class="tab" data-p="patients">المرضى</button><button class="tab" data-p="notvisited">لم تتم الزيارة</button><button class="tab" data-p="partial">Partial</button><button class="tab" data-p="notes">Note Done</button><button class="tab" data-p="partialnotes">Partial Note</button><button class="tab" data-p="drp0">DRP=0 + خدمات</button><button class="tab" data-p="services">الخدمات</button><button class="tab" data-p="harppanel">HARP</button><button class="tab" data-p="report">التقرير التنفيذي</button></div></div>
<div class="panel active" id="p-overview"><div class="kpis" id="kpis"></div><div class="grid2"><div class="card"><h3>Completion حسب الطبيب</h3><div class="chart"><canvas id="cCompletion"></canvas></div></div><div class="card"><h3>Utilization حتى تاريخ التقرير</h3><div class="chart"><canvas id="cUtil"></canvas></div></div><div class="card"><h3>حالة زيارات الطبيب</h3><div class="chart"><canvas id="cStatus"></canvas></div></div><div class="card"><h3>أحمال الخدمات</h3><div class="chart"><canvas id="cServices"></canvas></div></div></div></div>
<div class="panel" id="p-doctors"><div id="doctorTable"></div></div><div class="panel" id="p-patients"><div id="patientTable"></div></div><div class="panel" id="p-notvisited"><div id="neverTable"></div></div><div class="panel" id="p-partial"><div id="partialTable"></div></div><div class="panel" id="p-notes"><div id="noteTable"></div></div><div class="panel" id="p-partialnotes"><div id="partialNoteTable"></div></div><div class="panel" id="p-drp0"><div id="drp0Table"></div></div><div class="panel" id="p-services"><div id="serviceTable"></div></div><div class="panel" id="p-harppanel"><div id="harpTable"></div></div><div class="panel" id="p-report"><div class="card emailBox"><h3>التقرير الكتابي الجاهز للإيميل</h3><div class="emailActions"><button class="btn green" id="copyEmail">📋 نسخ التقرير</button><button class="btn blue" id="downloadEmail">⬇ تنزيل TXT</button></div><textarea class="emailReport" id="emailReport" spellcheck="false"></textarea></div><div class="insights" id="insights"></div></div></section></main>
<script>
(()=>{'use strict';
const PLANS=['NU P','PT P','LAB P','IV P','SPE P','Dialysis P','Speech P','ABA P','RT P','OT P','VAC P','Vaccination P','V. Call P'],DONES=PLANS.map(x=>x.replace(/ P$/,' D'));
const $=id=>document.getElementById(id),num=v=>{const n=Number(String(v??'').replace(/,/g,'').trim());return Number.isFinite(n)?n:0},txt=v=>String(v??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim(),norm=v=>txt(v).toLowerCase().replace(/[._-]+/g,' ').replace(/\s+/g,' '),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pct=v=>`${(Number(v||0)*100).toFixed(1)}%`,sum=(a,f)=>a.reduce((s,x)=>s+Number(f(x)||0),0),group=(a,f)=>{const m=new Map;for(const x of a){const k=f(x)||'Unknown';if(!m.has(k))m.set(k,[]);m.get(k).push(x)}return m};
let rows=[],filtered=[],charts={},meta={};const pick=(r,...names)=>{for(const n of names){const k=Object.keys(r).find(x=>norm(x)===norm(n));if(k!==undefined)return r[k]}return ''};
function decodeAOA(ab,name){const u=new Uint8Array(ab),utf16=u[0]===255&&u[1]===254;let t='';if(utf16)t=new TextDecoder('utf-16le').decode(u);else if(/\.html?$/i.test(name))t=new TextDecoder().decode(u);if(t&&/<table/i.test(t)){const d=new DOMParser().parseFromString(t,'text/html');return[...d.querySelectorAll('table tr')].map(tr=>[...tr.querySelectorAll('th,td')].map(td=>txt(td.textContent))).filter(r=>r.some(Boolean))}const wb=XLSX.read(ab,{type:'array'}),best=wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})).sort((a,b)=>b.length-a.length)[0];return best}

function secondaryObjects(aoa){const hi=aoa.findIndex(r=>r.some(x=>norm(x)==='ptid'));if(hi<0)throw Error('ملف GP with PT يجب أن يحتوي على PTID');const h=aoa[hi].map((x,i)=>txt(x)||`Column ${i+1}`);return aoa.slice(hi+1).filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(h.map((x,i)=>[x,r[i]??''])))}
function mapGpPt(raw){return raw.map(r=>({id:txt(pick(r,'PTID')),name:txt(pick(r,'Name','Patient Name')),city:txt(pick(r,'City')),area:txt(pick(r,'Area')),doctor:txt(pick(r,'Doctor')),insurance:txt(pick(r,'Insurance Company','Insurance')),group:txt(pick(r,'Group')),gp:num(pick(r,'GP Plan')),nu:num(pick(r,'NU Plan')),pt:num(pick(r,'PT Plan')),iv:num(pick(r,'IV Plan')),lab:num(pick(r,'LAB Plan')),drDone:num(pick(r,'DR Done')),status:txt(pick(r,'Status')),cdm:txt(pick(r,'CDM')),mobility:txt(pick(r,'Mobility'))||'Not Recorded',icd:txt(pick(r,'ICD Codes')),lastDr:txt(pick(r,'Last Dr Visit')),care:txt(pick(r,'Care Needs'))})).filter(x=>x.id)}
function gpptStats(){const a=gpptRows,needs=k=>a.filter(x=>norm(x.care).includes(norm(k))).length;return{patients:a.length,gpPt:a.filter(x=>x.gp>0&&x.pt>0).length,gpPlan:sum(a,x=>x.gp),ptPlan:sum(a,x=>x.pt),drDone:sum(a,x=>x.drDone),bedridden:a.filter(x=>norm(x.mobility)==='bedridden').length,wheelchair:a.filter(x=>norm(x.mobility).includes('wheelchair')).length,hospital:needs('Hospital'),urgent:needs('Urgent Visit'),notDone:needs('Not Done'),needsLab:needs('Needs Labs'),renew:needs('Renew File')}}
function cmeSignals(){const g=gpptStats(),admitted=filtered.filter(x=>x.hospitalAdmissions>0).length,high=filtered.filter(x=>x.harp==='High').length,missing=filtered.filter(x=>x.never&&!x.note).length,topics=[{topic:'منع دخول المستشفى القابل للتجنب والمتابعة بعد الخروج',score:(admitted+g.hospital)*10+g.urgent,why:`${admitted} حالة دخول في تقرير الأداء و${g.hospital} Hospital و${g.urgent} Urgent Visit في GP with PT`},{topic:'التكامل بين الطبيب والعلاج الطبيعي في الرعاية المنزلية',score:g.gpPt*2+g.bedridden+g.wheelchair,why:`${g.gpPt} مريض لديهم GP + PT، منهم ${g.bedridden} bedridden و${g.wheelchair} wheelchair`},{topic:'تقييم الخطورة HARP والتدخل المبكر للحالات عالية الخطورة',score:high*3,why:`${high} حالة High Risk ضمن نطاق الفلاتر`},{topic:'التوثيق السريري وGP Note للحالات غير المنفذة',score:missing*2+g.notDone,why:`${missing} Note Missing و${g.notDone} حالة Not Done`},{topic:'المتابعة المخبرية وتجديد الملف الأساسي',score:g.needsLab+g.renew,why:`${g.needsLab} تحتاج Labs و${g.renew} تحتاج Renew File`}];return topics.sort((a,b)=>b.score-a.score)}
function saturdays(anchor=$('reportDate').value){const d=new Date(anchor+'T12:00:00'),x=new Date(d.getFullYear(),d.getMonth(),1,12),out=[];while(x.getMonth()===d.getMonth()){if(x.getDay()===6)out.push(isoDate(x));x.setDate(x.getDate()+1)}return out}
function ensureCmePlan(){const topics=cmeSignals(),doctors=doctorSummary().map(x=>x.doctor),dates=saturdays();for(let i=0;i<dates.length;i++){let x=cmePlan.find(y=>y.date===dates[i]);if(!x){x={date:dates[i],time:'10:00–11:00',topic:'',presenter:'',status:'Planned',notes:''};cmePlan.push(x)}if(!x.topic)x.topic=topics[i%Math.max(1,topics.length)]?.topic||'';if(!x.presenter)x.presenter=doctors[i%Math.max(1,doctors.length)]||''}cmePlan.sort((a,b)=>a.date.localeCompare(b.date));localStorage.setItem(CME_STORAGE,JSON.stringify(cmePlan));return cmePlan.filter(x=>dates.includes(x.date))}

function renderCme(){if(!$('cmeContent'))return;const g=gpptStats(),topics=cmeSignals(),plan=ensureCmePlan(),n=nextCme();$('cmeContent').innerHTML=`<div class="cmeHero"><div><h2>برنامج التعليم الطبي المستمر CME</h2><p>اختيار موضوع قائم على مؤشرات الأداء، دخول المستشفى، HARP، والتكامل بين GP وPT.</p></div><div class="cmeTime">📅 كل سبت<br>🕙 10:00–11:00 صباحًا</div></div><div class="kpis"><div class="kpi" style="--c:#7c3aed"><span>المحاضرة القادمة</span><b style="font-size:16px">${esc(n?.date||'—')}</b></div><div class="kpi" style="--c:#2563eb"><span>GP with PT Patients</span><b>${g.patients}</b></div><div class="kpi" style="--c:#0f766e"><span>GP + PT Plan</span><b>${g.gpPt}</b></div><div class="kpi" style="--c:#dc2626"><span>Hospital / Urgent</span><b>${g.hospital+g.urgent}</b></div><div class="kpi" style="--c:#d97706"><span>Mobility Priority</span><b>${g.bedridden+g.wheelchair}</b></div><div class="kpi" style="--c:#16a34a"><span>PT Plan Total</span><b>${g.ptPlan}</b></div></div><div class="grid2"><div class="card"><h3>رفع وتحليل ملف GP with PT</h3><label class="cmeDrop ${gpptRows.length?'loaded':''}"><input id="gpptFile" type="file" accept=".xls,.xlsx,.html"><b>${gpptRows.length?'✅ '+esc(gpptFileName)+' — '+g.patients+' مريض':'📂 أسقط أو اختر ملف patient-assignment GP with PT'}</b><div class="scheduleNote">يُحلّل كملف ثانوي ولا يستبدل ملف الأداء الرئيسي.</div></label></div><div class="card"><h3>أعلى موضوعات CME المقترحة</h3><div class="topicCards">${topics.slice(0,3).map((x,i)=>`<div class="topicCard" style="--c:${['#dc2626','#7c3aed','#0f766e'][i]}"><b>${i+1}. ${esc(x.topic)}</b><span>${esc(x.why)}</span></div>`).join('')}</div></div></div><div class="card" style="margin-top:14px"><h3>إعداد نموذج API اختياري</h3><div class="apiGrid"><label>API Endpoint<input id="cmeApiEndpoint" value="https://api.openai.com/v1/chat/completions"></label><label>Model<input id="cmeApiModel" value="gpt-4.1-mini"></label><label>API Key — لا يُحفظ<input id="cmeApiKey" type="password" place function renderStaffTracker(){if(!$('staffContent'))return;const q=norm($('staffSearch')?.value),a=allStaff().filter(x=>!q||norm(`${x.id} ${x.name} ${x.specialty}`).includes(q));$('staffContent').innerHTML=`<div class="staffHero"><div><h2>متابعة حالة الموظفين</h2><p>يفتح تقرير Charge Sheet في iCare من بداية الشهر حتى التاريخ المحدد.</p></div><div class="staffDates"><label>من<input id="staffStart" type="date" value="${$('staffStart')?.value||monthStart(localToday())}"></label><label>إلى<input id="staffEnd" type="date" value="${$('staffEnd')?.value||localToday()}"></label><button class="btn white" id="staffToday">حتى اليوم</button></div></div><div class="card"><div class="staffForm"><label>الرقم الوظيفي<input id="newStaffId" inputmode="numeric" placeholder="مثال: 1225"></label><label>اسم الموظف<input id="newStaffName" placeholder="اسم الموظف"></label><label>التخصص / القسم<input id="newStaffSpecialty" placeholder="باطنة، علاج تنفسي..."></label><button class="btn green" id="addStaff">إضافة الموظف</button></div><div class="emailActions" style="margin-top:12px"><input id="staffSearch" value="${esc($('staffSearch')?.value||'')}" placeholder="بحث بالاسم أو الرقم أو التخصص" style="flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:10px"><button class="btn blue" id="exportStaff">تصدير القائمة Excel</button></div></div><div class="staffCards">${a.length?a.map(x=>`<article class="staffCard"><div class="staffId">${esc(x.id)}</div><h3>${esc(x.name||'موظف')}</h3><p>${esc(x.specialty||'غير محدد')}</p><div class="staffCardActions"><button class="btn blue" data-staff-open="${esc(x.id)}">فتح تقرير iCare</button>${x.fixed?'':`<button class="btn white" data-staff-delete="${esc(x.id)}">حذف</button>`}</div></article>`).join(''):'<div class="staffEmpty">لا توجد نتائج مطابقة.</div>'}</div>`}
function setupStaffTracker(){const tabs=$('tabs'),reportBtn=tabs.querySelector('[data-p="report"]'),b=document.createElement('button');b.className='tab';b.dataset.p='stafftracker';b.textContent='متابعة الموظفين';tabs.insertBefore(b,reportBtn);const p=document.createElement('div');p.className='panel';p.id='p-stafftracker';p.innerHTML='<div id="staffContent"></div>';$('p-report').before(p);TAB_LABELS.stafftracker='متابعة الموظفين';const quick=document.createElement('button');quick.className='btn ghost';quick.id='openStaffTracker';quick.textContent='👥 متابعة الموظفين';document.querySelector('header .actions').appendChild(quick);quick.onclick=()=>{$('drop').style.display='none';$('workspace').classList.add('show');$('status').className='status ok';$('status').textContent='متابعة الموظفين من بداية الشهر حتى التاريخ المحدد';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.p==='stafftracker'));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='p-stafftracker'));renderStaffTracker()};renderStaffTracker()}
setupStaffTracker();
function setupEmbeddedAnalyticsPages(){
  const tabs=$('tabs'),reportBtn=tabs.querySelector('[data-p="report"]');
  [
    {id:'drnotdoneapp',label:'DR Not Done المتقدم',title:'تحليل DR NOT DONE',desc:'تحليل الحالات غير المنفذة حسب الطبيب مع الفلاتر والتصدير.',src:'dr-not-done.html'},
    {id:'gpextraapp',label:'GP Extra Requests',title:'طلبات GP الإضافية',desc:'تحليل الطلبات الإضافية والموافقات والرفض والتقرير الجاهز.',src:'gp-extra-requests.html'}
  ].forEach(cfg=>{
    const b=document.createElement('button');b.className='tab';b.dataset.p=cfg.id;b.textContent=cfg.label;tabs.insertBefore(b,reportBtn);
    const p=document.createElement('div');p.className='panel';p.id='p-'+cfg.id;
    p.innerHTML='<div class="embeddedApp"><div class="embeddedAppHeader"><div><h2>'+cfg.title+'</h2><p>'+cfg.desc+'</p></div><a class="btn blue" href="'+cfg.src+'" target="_blank" rel="noopener">فتح في صفحة مستقلة</a></div><iframe class="embeddedAppFrame" title="'+cfg.title+'" loading="lazy" data-src="'+cfg.src+'" allow="clipboard-write"></iframe></div>';
    $('p-report').before(p);TAB_LABELS[cfg.id]=cfg.label;
    const q=document.createElement('button');q.className='btn ghost';q.textContent=cfg.id==='drnotdoneapp'?'📉 DR Not Done':'📋 GP Extra';document.querySelector('header .actions').appendChild(q);
    q.onclick=()=>{$('drop').style.display='none';$('workspace').classList.add('show');$('status').className='status ok';$('status').textContent=cfg.title;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.p===cfg.id));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='p-'+cfg.id));const f=p.querySelector('iframe');if(!f.getAttribute('src'))f.src=f.dataset.src};
  });
  tabs.addEventListener('click',e=>{const id=e.target.closest('.tab')?.dataset.p;if(!id)return;const f=document.querySelector('#p-'+id+' iframe[data-src]');if(f&&!f.getAttribute('src'))f.src=f.dataset.src});
}
setupEmbeddedAnalyticsPages();
$('staffContent').addEventListener('click',e=>{const open=e.target.closest('[data-staff-open]'),del=e.target.closest('[data-staff-delete]');if(open)window.open(staffReportUrl(open.dataset.staffOpen),'_blank','noopener,noreferrer');if(del){customStaff=customStaff.filter(x=>x.id!==del.dataset.staffDelete);localStorage.setItem(STAFF_STORAGE,JSON.stringify(customStaff));renderStaffTracker()}if(e.target.id==='staffToday'){$('staffEnd').value=localToday();$('staffStart').value=monthStart(localToday())}if(e.target.id==='addStaff'){const id=txt($('newStaffId').value),name=txt($('newStaffName').value),specialty=txt($('newStaffSpecialty').value);if(!/^\d+$/.test(id))return alert('أدخل رقمًا وظيفيًا صحيحًا بالأرقام فقط.');customStaff=customStaff.filter(x=>x.id!==id);customStaff.push({id,name:name||`موظف ${id}`,specialty:specialty||'غير محدد'});localStorage.setItem(STAFF_STORAGE,JSON.stringify(customStaff));renderStaffTracker()}if(e.target.id==='exportStaff'){const ws=XLSX.utils.aoa_to_sheet(staffAoa());styleWs(ws);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Employee Tracker');XLSX.writeFile(wb,`FutureCare_Employee_Tracker_${$('staffStart').value}_${$('staffEnd').value}.xlsx`,{compression:true})}});
$('staffContent').addEventListener('change',e=>{if(e.target.id==='staffSearch')renderStaffTracker();if(e.target.id==='staffEnd')$('staffStart').value=monthStart(e.target.value)});
const tabDataBeforeStaff=tabData;tabData=function(id){return id==='stafftracker'?staffAoa():tabDataBeforeStaff(id)};
exportAllTabsFiltered=function(){const wb=XLSX.utils.book_new(),ids=['overview','patients','notvisited','partial','notes','partialnotes','drp0','services','harppanel','mobility','admissions','lastvisit','schedule','cme','stafftracker','report'];for(const id of ids){const label=TAB_LABELS[id];XLSX.utils.book_append_sheet(wb,polishedSheet(label,tabData(id)),uniqueSheetName(wb,label))}for(const [doctor,z]of group(filtered,x=>x.doctor))XLSX.utils.book_append_sheet(wb,polishedSheet(`Doctor — ${doctor}`,aoaPatients(z)),uniqueSheetName(wb,`DR_${doctor}`));XLSX.writeFile(wb,exportFileName('All_Tabs'),{compression:true})};$('exportAllFiltered').onclick=exportAllTabsFiltered;$('excel').onclick=exportAllTabsFiltered;

const DEFAULT_DOCTOR_DIRECTORY=[

let doctorDirectory=(()=>{try{const v=JSON.parse(localStorage.getItem(DOCTOR_DIRECTORY_STORAGE)||'null');return Array.isArray(v)&&v.length?v:DEFAULT_DOCTOR_DIRECTORY.map(x=>({...x}))}catch{return DEFAULT_DOCTOR_DIRECTORY.map(x=>({...x}))}})();
function saveDoctorDirectory(){localStorage.setItem(DOCTOR_DIRECTORY_STORAGE,JSON.stringify(doctorDirectory))}
function directoryMatch(staffId,name){return doctorDirectory.find(x=>x.staffId===txt(staffId))||doctorDirectory.find(x=>norm(x.name)===norm(name))}
function applyDirectoryRow(x){x.staffId=x.staffId||txt(pick(x.raw||{},'Staff ID','StaffID','Doctor ID','DoctorID','ID'));x.doctorSource=x.doctorSource||x.doctor;const d=directoryMatch(x.staffId,x.doctorSource);x.doctor=d?.name||x.doctorSource||'Unassigned';x.specialist=d?.specialist||'Dr Ruqaya (465)';return x}
const mapRowsBeforeDirectory=mapRows;mapRows=function(raw){return mapRowsBeforeDirectory(raw).map(applyDirectoryRow)};
const doctorSummaryBeforeDirectory=doctorSummary;doctorSummary=function(a=filtered){return doctorSummaryBeforeDirectory(a).map(d=>{const z=a.filter(x=>x.doctor===d.doctor),r=z[0]||{},m=directoryMatch(r.staffId,d.doctor);return{...d,staffId:r.staffId||m?.staffId||'',specialist:r.specialist||m?.specialist||'Dr Ruqaya (465)'}})};
function directoryAoa(){return[['Staff ID','Doctor Name','Supervising Specialist','Assigned Patients'],...doctorDirectory.map(d=>[d.staffId,d.name,d.specialist,rows.filter(x=>x.staffId===d.staffId||x.doctor===d.name).length])]}
function directorySpecialists(){return[...new Set(['Dr Islam (1225)','Dr Ruqaya (465)',...doctorDirectory.map(x=>x.specialist).filter(Boolean)])]}
function renderDoctorDirectory(){if(!$('doctorDirectoryContent'))return;const by=group(doctorDirectory,x=>x.specialist);$('doctorDirectoryContent').innerHTML=`<div class="doctorDirectoryHero"><div><h2>دليل الأطباء والأرقام الوظيفية</h2><p>المرجع الموحد لأسماء الأطباء والتوزيع على الاختصاصيين في الداشبورد وكل ملفات Excel.</p></div><button class="btn white" id="resetDoctorDirectory">استعادة القائمة الأساسية</button></div><div class="directorySummary"><div class="directoryStat"><b>${doctorDirectory.length}</b>طبيب</div>${[...by].map(([k,v])=>`<div class="directoryStat"><b>${v.length}</b>${esc(k)}</div>`).join('')}</div><div class="card"><div class="directoryForm"><label>الرقم الوظيفي<input id="dirNewId" inputmode="numeric" placeholder="Staff ID"></label><label>اسم الطبيب<input id="dirNewName" placeholder="Doctor name"></label><label>الاختصاصي<select id="dirNewSpecialist">${directorySpecialists().map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><button class="btn green" id="dirAdd">إضافة طبيب</button></div><div class="emailActions" style="margin-top:12px"><button class="btn blue" id="dirExport">تصدير الدليل Excel</button></div></div>${table(['الرقم الوظيفي','اسم الطبيب المعتمد','الاختصاصي المشرف','الحالات الحالية','إجراء'],doctorDirectory.map((d,i)=>`<tr><td><input class="directoryInput" data-dir-index="${i}" data-dir-field="staffId" value="${esc(d.staffId)}"></td><td><input class="directoryInput" data-dir-index="${i}" data-dir-field="name" value="${esc(d.name)}"></td><td><select class="directorySelect" data-dir-index="${i}" data-dir-field="specialist">${directorySpecialists().map(x=>`<option ${x===d.specialist?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td>${rows.filter(x=>x.staffId===d.staffId||x.doctor===d.name).length}</td><td><button class="mini" data-dir-delete="${i}">حذف</button></td></tr>`))}`}
function setupDoctorDirectory(){const tabs=$('tabs'),reportBtn=tabs.querySelector('[data-p="report"]'),b=document.createElement('button');b.className='tab';b.dataset.p='doctordirectory';b.textContent='دليل الأطباء';tabs.insertBefore(b,reportBtn);const p=document.createElement('div');p.className='panel';p.id='p-doctordirectory';p.innerHTML='<div id="doctorDirectoryContent"></div>';$('p-report').before(p);TAB_LABELS.doctordirectory='Doctor Directory';const q=document.createElement('button');q.className='btn ghost';q.textContent='🪪 دليل الأطباء';document.querySelector('header .actions').appendChild(q);q.onclick=()=>{$('drop').style.display='none';$('workspace').classList.add('show');$('status').className='status ok';$('status').textContent='دليل الأطباء والتوزيع على الاختصاصيين';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.p==='doctordirectory'));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='p-doctordirectory'));renderDoctorDirectory()};const specialist=document.createElement('select');specialist.id='specialist';specialist.innerHTML='<option value="">كل الاختصاصيين</option>'+directorySpecialists().map(x=>`<option>${esc(x)}</option>`).join('');$('harp').after(specialist);specialist.addEventListener('change',apply);renderDoctorDirectory()}
setupDoctorDirectory();
function refreshDirectoryUsage(){rows.forEach(applyDirectoryRow);options('doctor',rows.map(x=>x.doctor),'كل الأطباء');const s=$('specialist'),old=s?.value||'';if(s){s.innerHTML='<option value="">كل الاختصاصيين</option>'+directorySpecialists().map(x=>`<option>${esc(x)}</option>`).join('');s.value=old}apply();renderDoctorDirectory()}
$('doctorDirectoryContent').addEventListener('change',e=>{const i=Number(e.target.dataset.dirIndex),f=e.target.dataset.dirField;if(Number.isInteger(i)&&doctorDirectory[i]&&['staffId','name','specialist'].includes(f)){doctorDirectory[i][f]=txt(e.target.value);saveDoctorDirectory();refreshDirectoryUsage()}});
$('doctorDirectoryContent').addEventListener('click',e=>{if(e.target.id==='dirAdd'){const staffId=txt($('dirNewId').value),name=txt($('dirNewName').value),specialist=txt($('dirNewSpecialist').value);if(!/^\d+$/.test(staffId)||!name)return alert('أدخل رقمًا وظيفيًا صحيحًا واسم الطبيب.');doctorDirectory=doctorDirectory.filter(x=>x.staffId!==staffId);doctorDirectory.push({staffId,name,specialist});saveDoctorDirectory();refreshDirectoryUsage()}if(e.target.dataset.dirDelete!==undefined){doctorDirectory.splice(Number(e.target.dataset.dirDelete),1);saveDoctorDirectory();refreshDirectoryUsage()}if(e.target.id==='resetDoctorDirectory'){doctorDirectory=DEFAULT_DOCTOR_DIRECTORY.map(x=>({...x}));saveDoctorDirectory();refreshDirectoryUsage()}if(e.target.id==='dirExport'){const wb=XLSX.utils.book_new(),ws=polishedSheet('Doctor Directory',directoryAoa());XLSX.utils.book_append_sheet(wb,ws,'Doctor Directory');XLSX.writeFile(wb,`FutureCare_Doctor_Directory_${$('reportDate').value||localToday()}.xlsx`,{compression:true})}});
const applyBeforeDirectory=apply;apply=function(){const q=norm($('search').value),d=$('doctor').value,b=$('branch').value,c=$('city').value,co=$('company').value,h=$('harp').value,sp=$('specialist')?.value||'',services=selectedServices();filtered=rows.filter(x=>(!q||norm(`${x.id} ${x.patient} ${x.doctor} ${x.staffId} ${x.specialist}`).includes(q))&&(!d||x.doctor===d)&&(!b||x.branch===b)&&(!c||x.city===c)&&(!co||x.company===co)&&(!h||x.harp===h)&&(!sp||x.specialist===sp)&&(!services.length||services.some(s=>x.services[s]?.p>0||x.services[s]?.d>0)));render()};
function enrichDoctorDirectoryTables(){const doctorTable=$('doctorTable')?.querySelector('table');if(doctorTable&&!doctorTable.dataset.directory){doctorTable.dataset.directory='1';doctorTable.tHead.rows[0].cells[0].insertAdjacentHTML('afterend','<th>Staff ID</th><th>Specialist</th>');const ds=doctorSummary();[...doctorTable.tBodies[0].rows].forEach((tr,i)=>tr.cells[0]?.insertAdjacentHTML('afterend',`<td>${esc(ds[i]?.staffId||'—')}</td><td>${esc(ds[i]?.specialist||'Dr Ruqaya (465)')}</td>`))}const sets={patientTable:filtered,neverTable:filtered.filter(x=>x.never),partialTable:filtered.filter(x=>x.partial),noteTable:filtered.filter(x=>x.noteDone),partialNoteTable:filtered.filter(x=>x.partialNoteDone),drp0Table:filtered.filter(x=>x.drp0Services)};Object.entries(sets).forEach(([id,a])=>{const t=$(id)?.querySelector('table');if(!t||t.dataset.directory)return;t.dataset.directory='1';t.tHead.rows[0].cells[2]?.insertAdjacentHTML('afterend','<th>Staff ID</th><th>Specialist</th>');[...t.tBodies[0].rows].forEach((tr,i)=>tr.cells[2]?.insertAdjacentHTML('afterend',`<td>${esc(a[i]?.staffId||'—')}</td><td>${esc(a[i]?.specialist||'Dr Ruqaya (465)')}</td>`))})}
const renderBeforeDirectory=render;render=function(){renderBeforeDirectory();enrichDoctorDirectoryTables();renderDoctorDirectory()};
const aoaPatientsBeforeDirectory=aoaPatients;aoaPatients=function(a){const z=aoaPatientsBeforeDirectory(a);return[z[0].slice(0,2).concat(['Staff ID',z[0][2],'Specialist'],z[0].slice(3)),...z.slice(1).map((r,i)=>r.slice(0,2).concat([a[i].staffId||'',r[2],a[i].specialist||'Dr Ruqaya (465)'],r.slice(3)))]};
const summaryAoaBeforeDirectory=summaryAoa;summaryAoa=function(a=filtered){const z=summaryAoaBeforeDirectory(a),ds=doctorSummary(a);return[['Staff ID','Doctor','Specialist',...z[0].slice(1)],...z.slice(1).map((r,i)=>[ds[i]?.staffId||'',r[0],ds[i]?.specialist||'Dr Ruqaya (465)',...r.slice(1)])]};
const tabDataBeforeDirectory=tabData;tabData=function(id){return id==='doctordirectory'?directoryAoa():tabDataBeforeDirectory(id)};
const buildEmailReportBeforeDirectory=buildEmailReport;buildEmailReport=function(){const base=buildEmailReportBeforeDirectory(),lines=doctorSummary().map(d=>`- ${d.staffId||'بدون رقم'} — ${d.doctor} — الاختصاصي: ${d.specialist}`).join('\n');return base.replace('\n\nوتفضلوا بقبول فائق الاحترام،',`\n\nتوزيع الأطباء حسب الرقم الوظيفي والاختصاصي المشرف\n${lines||'- لا توجد بيانات أطباء في النطاق المحدد.'}\n\nوتفضلوا بقبول فائق الاحترام،`)};
const writeFileBeforeDirectory=XLSX.writeFile.bind(XLSX);XLSX.writeFile=function(wb,name,opts){if(!wb.SheetNames.includes('Doctor Directory'))XLSX.utils.book_append_sheet(wb,polishedSheet('Doctor Directory',directoryAoa()),uniqueSheetName(wb,'Doctor Directory'));return writeFileBeforeDirectory(wb,name,opts)};
exportAllTabsFiltered=function(){const wb=XLSX.utils.book_new(),ids=['overview','doctordirectory','patients','notvisited','partial','notes','partialnotes','drp0','services','harppanel','mobility','admissions','lastvisit','schedule','cme','stafftracker','report'];for(const id of ids){const label=TAB_LABELS[id];XLSX.utils.book_append_sheet(wb,polishedSheet(label,tabData(id)),uniqueSheetName(wb,label))}for(const [doctor,z]of group(filtered,x=>x.doctor))XLSX.utils.book_append_sheet(wb,polishedSheet(`Doctor — ${doctor}`,aoaPatients(z)),uniqueSheetName(wb,`DR_${doctor}`));XLSX.writeFile(wb,exportFileName('All_Tabs'),{compression:true})};$('exportAllFiltered').onclick=exportAllTabsFiltered;$('excel').onclick=exportAllTabsFiltered;
